<section id="contact" class="section">
  <div class="section__container">
    <h2 class="section__title">Contacto</h2>
    <p class="contact__intro">¿Interesado en trabajar juntos? ¡No dudes en contactarme!</p>
    <div class="contact-grid">
      <a [href]="'mailto:' + info.email" class="contact-card">
        <i class="fa-solid fa-envelope"></i>
        <h3>Email</h3>
        <p>{{ info.email }}</p>
      </a>
      <a [href]="'tel:' + info.phone" class="contact-card">
        <i class="fa-solid fa-phone"></i>
        <h3>Teléfono</h3>
        <p>{{ info.phone }}</p>
      </a>
      <a [href]="info.linkedin" target="_blank" class="contact-card">
        <i class="fa-brands fa-linkedin"></i>
        <h3>LinkedIn</h3>
        <p>Ver perfil</p>
      </a>
      <a [href]="info.github" target="_blank" class="contact-card">
        <i class="fa-brands fa-github"></i>
        <h3>GitHub</h3>
        <p>Ver repositorios</p>
      </a>
    </div>
  </div>
</section>
