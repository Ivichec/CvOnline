<app-navbar />
<main class="screen-only">
  <app-header />
  <app-about />
  <app-experience />
  <app-education />
  <app-skills />
  <app-projects />
  <app-languages />
  <app-courses />
  <app-contact />
</main>
<app-footer />

<!-- PDF version (only visible when printing) -->
<app-cv-pdf />

<!-- Download CV button -->
<button class="fab fab--download" (click)="downloadPdf()" aria-label="Descargar CV">
  <i class="fa-solid fa-download"></i>
</button>

<!-- Back to top button -->
<button
  class="fab fab--top"
  [ngClass]="{ visible: showBackToTop }"
  (click)="scrollToTop()"
  aria-label="Volver arriba">
  <i class="fa-solid fa-arrow-up"></i>
</button>
