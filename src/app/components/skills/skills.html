<section id="skills" class="section">
  <div class="section__container">
    <h2 class="section__title">Habilidades técnicas</h2>
    <div class="skills-categories">
      @for (entry of skillsByCategory | keyvalue; track entry.key) {
        <div class="skills-category">
          <h3 class="skills-category__title">{{ entry.key }}</h3>
          <div class="skills-list">
            @for (skill of entry.value; track skill.name) {
              <div class="skill">
                <div class="skill__header">
                  <span class="skill__name">{{ skill.name }}</span>
                  <span class="skill__level">{{ skill.level }}%</span>
                </div>
                <div class="skill__bar">
                  <div class="skill__fill" [style.width.%]="skill.level"></div>
                </div>
              </div>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
